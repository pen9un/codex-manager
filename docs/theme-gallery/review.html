<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>二十组完整界面主题</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f5;color:#243348;font:15px/1.6 'Segoe UI','Microsoft YaHei UI',sans-serif}main{max-width:1800px;margin:auto;padding:28px}h1{margin:0;font-size:28px}p{color:#53647a}nav{display:flex;gap:14px;flex-wrap:wrap;position:sticky;top:0;background:#edf1f5;padding:16px 0;z-index:1}label{display:flex;align-items:center;gap:8px}select{padding:8px;border:1px solid #71829b;border-radius:6px;font:inherit;background:white;color:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}article{background:white;border:1px solid #a6b3c4;border-radius:14px;overflow:hidden}h2{font-size:17px;margin:14px 18px}img{display:block;width:100%;aspect-ratio:16/10;object-fit:contain}a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #286ca8;outline-offset:3px}@media(max-width:900px){.grid{grid-template-columns:1fr}main{padding:18px}}
</style><main><h1>二十组完整界面主题</h1><p>比较标题栏、会话列表、输入区、设置与弹窗。此处全部为同引擎隔离预览；真实客户端验证范围单独记入验收报告。</p>
<nav><label>外观<select id="mode"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>页面<select id="view"><option value="home">首页</option><option value="task">任务页</option><option value="settings">设置</option><option value="components">菜单与弹窗</option></select></label><label>窗口<select id="width"><option>1280</option><option>920</option><option>1920</option></select></label><label><input type="checkbox" id="hide-art">隐藏首页主图</label></nav>
<div class="grid"><article><h2>小果与大果 · 并肩小基地</h2><a target="_blank" rel="noopener"><img data-theme="fruit-base" alt="小果与大果 · 并肩小基地隔离预览"></a></article><article><h2>噜噜与噜妹 · 慢半拍搭档</h2><a target="_blank" rel="noopener"><img data-theme="lulu-duo" alt="噜噜与噜妹 · 慢半拍搭档隔离预览"></a></article><article><h2>吉伊卡哇 · 小小冒险队</h2><a target="_blank" rel="noopener"><img data-theme="chiikawa-camp" alt="吉伊卡哇 · 小小冒险队隔离预览"></a></article><article><h2>LABUBU · 怪趣森林</h2><a target="_blank" rel="noopener"><img data-theme="labubu-forest" alt="LABUBU · 怪趣森林隔离预览"></a></article><article><h2>龙猫 · 森林候车站</h2><a target="_blank" rel="noopener"><img data-theme="totoro-stop" alt="龙猫 · 森林候车站隔离预览"></a></article><article><h2>千与千寻 · 海上列车</h2><a target="_blank" rel="noopener"><img data-theme="sea-train" alt="千与千寻 · 海上列车隔离预览"></a></article><article><h2>哈尔 · 云上城堡</h2><a target="_blank" rel="noopener"><img data-theme="cloud-castle" alt="哈尔 · 云上城堡隔离预览"></a></article><article><h2>像素开发部</h2><a target="_blank" rel="noopener"><img data-theme="pixel-studio" alt="像素开发部隔离预览"></a></article><article><h2>透明机核</h2><a target="_blank" rel="noopener"><img data-theme="crystal-core" alt="透明机核隔离预览"></a></article><article><h2>零日终端</h2><a target="_blank" rel="noopener"><img data-theme="zero-day" alt="零日终端隔离预览"></a></article><article><h2>霓虹疾行</h2><a target="_blank" rel="noopener"><img data-theme="neon-rider" alt="霓虹疾行隔离预览"></a></article><article><h2>苔原松风</h2><a target="_blank" rel="noopener"><img data-theme="pine-retreat" alt="苔原松风隔离预览"></a></article><article><h2>潮汐来信</h2><a target="_blank" rel="noopener"><img data-theme="tidal-letter" alt="潮汐来信隔离预览"></a></article><article><h2>纸上山河</h2><a target="_blank" rel="noopener"><img data-theme="ink-landscape" alt="纸上山河隔离预览"></a></article><article><h2>星港远航</h2><a target="_blank" rel="noopener"><img data-theme="orbital-harbor" alt="星港远航隔离预览"></a></article><article><h2>霓虹雨巷</h2><a target="_blank" rel="noopener"><img data-theme="neon-rain" alt="霓虹雨巷隔离预览"></a></article><article><h2>浮岛信使</h2><a target="_blank" rel="noopener"><img data-theme="floating-courier" alt="浮岛信使隔离预览"></a></article><article><h2>绒云小筑</h2><a target="_blank" rel="noopener"><img data-theme="cloud-cottage" alt="绒云小筑隔离预览"></a></article><article><h2>晴空绘旅</h2><a target="_blank" rel="noopener"><img data-theme="skyward-journal" alt="晴空绘旅隔离预览"></a></article><article><h2>月下弦歌</h2><a target="_blank" rel="noopener"><img data-theme="moonlit-serenade" alt="月下弦歌隔离预览"></a></article></div></main><script>
const mode=document.querySelector('#mode'),view=document.querySelector('#view'),width=document.querySelector('#width'),hide=document.querySelector('#hide-art');function update(){document.querySelectorAll('img').forEach(img=>{img.src='visual-1/'+img.dataset.theme+'-'+mode.value+'-'+(hide.checked?'without-art':view.value+'-'+width.value)+'.webp';img.parentElement.href=img.src})}for(const item of [mode,view,width,hide])item.onchange=()=>{if(item===view||item===width)hide.checked=false;update()};update();
</script></html>
