name: 发布 Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: 校验版本与发布提交
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 读取版本并校验标签
        id: metadata
        run: node scripts/release.cjs metadata
      - name: 已有标签必须指向本次构建提交
        run: node scripts/release.cjs verify-target

  build:
    needs: validate
    uses: ./.github/workflows/build.yml

  publish:
    name: 发布完整安装包
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-release-${{ needs.validate.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 下载已验证的发布包
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: releases/artifacts
      - name: 再次验证附件并生成发布说明
        run: node scripts/release.cjs prepare
      - name: 发布前再次核对版本标签
        run: node scripts/release.cjs verify-target
      - name: 创建草稿、上传全部附件后公开
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > releases/existing-release.json 2> releases/release-query.log; then
            if [ "$(node -p 'require("./releases/existing-release.json").isDraft')" != 'true' ]; then
              echo '此版本已经公开发布，请使用新版本号；不会覆盖现有安装包。'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --draft --title "Codex Manager $RELEASE_TAG" --notes-file releases/RELEASE_NOTES.md --generate-notes --prerelease="$IS_PRERELEASE"
          fi
          gh release upload "$RELEASE_TAG" releases/artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$IS_PRERELEASE"
