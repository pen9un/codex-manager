appId: io.github.codex-manager
productName: Codex-Manager
asar: true
compression: maximum

directories:
  output: releases

files:
  - out/**
  - package.json
  - resources/**
  - from: src/shared/vendor
    to: resources/licenses
    filter:
      - '*LICENSE.txt'

win:
  icon: resources/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Codex-Manager-${version}-Windows-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Codex-Manager
  deleteAppDataOnUninstall: false

mac:
  icon: resources/icon.png
  category: public.app-category.developer-tools
  # 本地签名不等同于 Apple 开发者身份签名或公证。
  identity: '-'
  hardenedRuntime: false
  notarize: false
  target:
    - dmg
    - zip
  artifactName: Codex-Manager-${version}-macOS-${arch}.${ext}

linux:
  icon: resources/icon.png
  category: Development
  maintainer: pen9un <pen9un@users.noreply.github.com>
  target:
    - AppImage
    - deb
  artifactName: Codex-Manager-${version}-Linux-${arch}.${ext}

